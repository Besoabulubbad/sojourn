#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# CI on Linux cannot build Apple targets; skip them silently instead of warning on every task.
kotlin.native.ignoreDisabledTargets=true

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Roborazzi (ADR 0010)
# Plain test tasks (and therefore `check`) verify screenshots against the committed baselines;
# `recordRoborazzi<Target>` re-records. Explicit file names resolve under each module's roborazzi.outputDir.
roborazzi.test.verify=true
roborazzi.record.filePathStrategy=relativePathFromRoborazziContextOutputDirectory
