# The booking golden path (plan, Phase 6): from Explore to "You're booked", in English, on a fresh install.
# Dates are next month, so the flow does not depend on today's date. Run: maestro test .maestro/
appId: com.abulubad.sojourn
name: Booking golden path
tags:
  - booking
---
- launchApp:
    clearState: true
- runFlow: common/english.yaml
- assertVisible: "Find your next home base"
- tapOn: "London"
- assertVisible: ".*stays in London"
- scrollUntilVisible:
    element: "Riverside two-bed for longer stays"
- tapOn: "Riverside two-bed for longer stays"
- tapOn: "Choose dates"
- tapOn: "Next month"
- tapOn:
    text: "10"
    index: 0
- tapOn:
    text: "20"
    index: 0
- tapOn: "See the total"
- assertVisible: ".*total"
- tapOn: "Reserve"
- assertVisible: "Review and pay"
# "Pay £1,383": the button carries the amount (the wallet also has a "Pay to" row).
- tapOn: "Pay .*[0-9].*"
# The demo wallet says no money moves, and asks again with the same total.
- assertVisible: "Demo wallet"
- assertVisible: ".*No money moves.*"
# The sheet slides up; tap its button once it has settled.
- waitForAnimationToEnd
- tapOn: "Pay .*[0-9].*"
# Paying and booking go through the demo network, which takes a moment.
- extendedWaitUntil:
    visible: "You’re booked"
    timeout: 15000
- tapOn: "View booking"
- assertVisible: "Address"
# On a small screen (CI's emulator) the page continues below the fold.
- scrollUntilVisible:
    element: "Add to calendar"
