# The pull-request gate (ADR 0011): static analysis → architecture tests → unit and screenshot tests →
# dependency health → a debug APK. Linux only; iOS compiles on main.yml's macOS job.
name: PR checks

on:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify (Android + JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Static analysis (detekt)
        run: ./gradlew detekt --continue

      - name: Architecture, unit and screenshot tests · dependency health · debug APK
        run: ./gradlew check buildHealth :app:android:assembleDebug --continue

      - name: Test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: "**/build/test-results/**/*.xml"
          check_name: Test results
          detailed_summary: true

      - name: Screenshot diffs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshot-diffs
          path: "**/build/outputs/roborazzi/**"
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iOS tests and screenshots (macOS)
    # iOS can only be built and tested on macOS. Runs in parallel with the Linux job: every common and iOS unit
    # test on the simulator, plus the iOS screenshot verify (ADR 0010). Informational, not a required check: a red
    # result is visible on the PR but does not block merging (decided 2026-11-16, ADR 0011 note).
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The Kotlin/Native toolchain and its per-target caches (~1 GB) are most of a cold run; keep them between runs.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: iOS simulator tests and screenshot verify
        run: ./gradlew iosSimulatorArm64Test --continue

      - name: Test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: "**/build/test-results/iosSimulatorArm64Test/*.xml"
          check_name: iOS test results
          detailed_summary: true

      - name: iOS screenshot diffs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-screenshot-diffs
          path: "**/build/outputs/roborazzi/**"
          if-no-files-found: ignore
          retention-days: 7
