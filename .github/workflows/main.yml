# Runs on every merge to main and nightly: the PR gate plus the iOS framework and simulator app on macOS
# (ADR 0011). Emulator jobs (Compose UI tests, Maestro) join in Phase 6.
name: Main

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # nightly, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and verify (Android + JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # The free Ubuntu runner has ~14 GB free; the build, Robolectric and the screenshot matrix now need more.
      # Remove preinstalled toolchains this project never uses (.NET, Haskell, Boost, CodeQL, Docker images).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - run: ./gradlew detekt --continue
      - run: ./gradlew check buildHealth :app:android:assembleDebug --continue
      - uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: "**/build/test-results/**/*.xml"
          check_name: Test results (main)

  ios:
    name: iOS framework and simulator app
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Compile the shared framework (simulator)
        run: ./gradlew :app:shared:linkDebugFrameworkIosSimulatorArm64
      - name: Build the iOS app for the simulator
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify --quiet || xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build
