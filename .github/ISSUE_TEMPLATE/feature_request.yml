name: Feature or change
description: Propose a screen, component, behaviour or engineering change
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing for the guest, or for engineers working in the repo.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead. Reference the design-system card or ADR if one exists.
    validations:
      required: true
  - type: input
    id: card
    attributes:
      label: Design-system card or ADR
      placeholder: ScreenDetails · ADR 0007 · none
  - type: input
    id: modules
    attributes:
      label: Modules likely touched
      placeholder: feature:details, core:designsystem
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable outcomes — states, variants, tests, docs. The Definition of Done in docs/guides/adding-a-feature.md applies to screens.
      placeholder: |
        - [ ] …
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not contradict an accepted ADR (or this issue proposes a new one)
